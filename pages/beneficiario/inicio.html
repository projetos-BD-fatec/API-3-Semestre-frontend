<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FUSEx - Início</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/main.css">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                FUSEx
            </a>
            <button class="menu-button">
                ☰
            </button>
        </div>
    </header>

    <main class="main-container">
        <section class="welcome">
            <h1 id="welcome-title">Olá!</h1>
            <p>
                O que você deseja fazer?
            </p>
        </section>

        <section class="actions">
            <a href="nova-pre-guia.html"
               class="action-card">
                <div class="action-icon">
                    +
                </div>
                <div>
                    <h2>Nova solicitação</h2>
                    <p>
                        Solicite uma nova pré-guia
                    </p>
                </div>
            </a>

            <a href="pre-guias.html"
               class="action-card">
                <div class="action-icon">
                    ≡
                </div>
                <div>
                    <h2>Minhas solicitações</h2>
                    <p>
                        Acompanhe seus pedidos
                    </p>
                </div>
            </a>

            <!-- Só aparece para quem tem perfil FUSEX / LISURA / ADMIN (js/acesso-lisura.js) -->
            <a href="../lisura/index.html"
               class="action-card action-card-lisura"
               id="card-lisura"
               hidden>
                <div class="action-icon">
                    ⚖
                </div>
                <div>
                    <h2>Lisura</h2>
                    <p>
                        Conferir espelhos enviados pelas OCS
                    </p>
                </div>
            </a>
        </section>

        <!-- A idéia desse card aqui é mostrar apenas a solicitação mais recente, seja o status dela em análise, negado ou aprovado -->
        <section class="recent" id="recent" hidden>
            <h2>Solicitação recente</h2>
            <div id="recent-card"></div>
        </section>
    </main>
    <script src="../../js/api.js"></script>
    <script src="../../js/formatters.js"></script>
    <script src="../../js/request-card.js"></script>
    <script src="../../js/ficha-pre-guia.js"></script>
    <script src="../../js/inicio.js"></script>
    <script src="../../js/acesso-lisura.js"></script>
</body>
</html>
