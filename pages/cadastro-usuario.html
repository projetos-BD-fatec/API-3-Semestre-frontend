<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FUSEx - Cadastro de Usuário</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">
    <div class="header-container">

        <a href="../index.html" class="logo">
            FUSEx
        </a>

        <button class="menu-button"
                type="button"
                aria-label="Abrir menu">
            ☰
        </button>

    </div>
</header>


<main class="main-container">

    <section class="page-header">
        <h1>Cadastro de usuário</h1>

        <p>
            Preencha seus dados para criar seu acesso ao FUSEx.
        </p>
    </section>


    <form id="formCadastroUsuario">

        <section class="form-section">

            <h2>Dados pessoais</h2>

            <p class="form-description">
                Informe seus dados de identificação.
            </p>


            <div class="form-field">
                <label for="nomeUsuario">
                    Nome
                </label>

                <input
                        type="text"
                        id="nomeUsuario"
                        name="nomeUsuario"
                        placeholder="Digite seu nome"
                        maxlength="150"
                        required
                >
            </div>


            <div class="form-field">
                <label for="cpf">
                    CPF
                </label>

                <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                >
            </div>


            <div class="form-field">
                <label for="precCp">
                    PREC/CP
                </label>

                <input
                        type="text"
                        id="precCp"
                        name="precCp"
                        placeholder="Digite seu PREC/CP"
                        maxlength="30"
                        required
                >
            </div>


            <div class="form-field">
                <label for="telefone">
                    Telefone
                </label>

                <input
                        type="text"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        maxlength="20"
                >
            </div>

        </section>


        <section class="form-section">

            <h2>Dados de acesso</h2>

            <p class="form-description">
                Informe o e-mail e a senha que serão utilizados no acesso ao sistema.
            </p>


            <div class="form-field">
                <label for="email">
                    E-mail
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        maxlength="150"
                        required
                >
            </div>


            <div class="form-field">
                <label for="senha">
                    Senha
                </label>

                <div class="password-wrapper">

                    <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            minlength="6"
                            maxlength="100"
                            required
                    >

                    <button
                            type="button"
                            id="toggleSenha"
                            class="password-toggle"
                            aria-label="Mostrar senha"
                    >
                        Mostrar
                    </button>

                </div>

                <span class="field-helper">
                    A senha deve possuir pelo menos 6 caracteres.
                </span>
            </div>

        </section>


        <div id="mensagemCadastro"
             class="form-feedback"></div>


        <div class="form-actions">

            <button
                    type="button"
                    class="secondary-button"
                    onclick="history.back()"
            >
                Voltar
            </button>

            <button
                    type="submit"
                    id="btnCadastrar"
                    class="primary-button"
            >
                Criar conta
            </button>

        </div>

    </form>

</main>


<script src="../js/cadastro-usuario.js"></script>

</body>

</html>
